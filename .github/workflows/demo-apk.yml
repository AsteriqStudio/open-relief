name: Offline demo APK

on:
  push:
    branches: [feature/sandbox-mvp]
    paths:
      - '.github/workflows/demo-apk.yml'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'scripts/build-demo-apk.sh'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Install Android build components
        run: |
          sdk_root="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            mkdir -p "$sdk_root/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-commandline-tools.zip"
            unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$sdk_root/cmdline-tools"
            mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$manager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Build embedded, signed demo APK
        run: |
          if bash scripts/build-demo-apk.sh > "$RUNNER_TEMP/demo-apk-build.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/demo-apk-build.log"
          else
            tail -100 "$RUNNER_TEMP/demo-apk-build.log"
            {
              echo '### APK build failure details'
              echo '```text'
              tail -100 "$RUNNER_TEMP/demo-apk-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            detail="$(awk '/What went wrong:/{found=1;next}/Try:/{found=0} found' "$RUNNER_TEMP/demo-apk-build.log" | tr '\n' ' ' | cut -c1-800)"
            [[ -n "$detail" ]] || detail="$(tail -8 "$RUNNER_TEMP/demo-apk-build.log" | tr '\n' ' ' | cut -c1-800)"
            echo "::error title=Demo APK build failed::$detail"
            exit 1
          fi
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-relief-demo-apk
          path: |
            builds/open-relief-demo.apk
            builds/open-relief-demo.apk.sha256
          if-no-files-found: error
      - name: Publish labeled prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase11-demo-rc3
          name: Open Relief full-flow offline walkthrough RC3
          prerelease: true
          make_latest: false
          body: |
            Four-tab offline walkthrough: donor deck and checkout, fictional recipient intake, local sample review queue, activity dashboard, and legal drafts. Seven fictional bills cover electric, water, gas, medical, and telecom categories.
            No charge, document upload, OCR, verified creditor decision, disbursement, or charitable tax receipt occurs in this APK. The connected sandbox requires a separate API environment.
            Built with an embedded JavaScript bundle and demo signing key for Android sideloading. If Android rejects an update because of a signing mismatch, uninstall the prior demo before installing RC3; local demo state will reset.
          files: |
            builds/open-relief-demo.apk
            builds/open-relief-demo.apk.sha256
