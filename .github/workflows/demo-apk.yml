name: Offline demo APK

on:
  push:
    branches: [feature/sandbox-mvp]
    paths:
      - '.github/workflows/demo-apk.yml'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'scripts/build-demo-apk.sh'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Build embedded, signed demo APK
        run: bash scripts/build-demo-apk.sh
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-relief-demo-apk
          path: |
            builds/open-relief-demo.apk
            builds/open-relief-demo.apk.sha256
          if-no-files-found: error
      - name: Publish labeled prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase11-demo-rc1
          name: Phase 11 offline pitch demo RC1
          prerelease: true
          make_latest: false
          body: |
            Fictional offline pitch simulation. No charges, disbursements, verified creditor payments, or charitable tax receipts occur in this APK.
            Built with an embedded JavaScript bundle and demo signing key for Android sideloading. It is not approved for public financial use.
          files: |
            builds/open-relief-demo.apk
            builds/open-relief-demo.apk.sha256
